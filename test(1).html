<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП Справочник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: var(--tg-theme-bg-color, #17212b); --text-color: var(--tg-theme-text-color, #f5f5f5); --card-bg: var(--tg-theme-secondary-bg-color, #232e3c); --button-color: var(--tg-theme-button-color, #5288c1); --button-text: var(--tg-theme-button-text-color, #ffffff); --hint-color: var(--tg-theme-hint-color, #7f91a4); }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        #menu-screen, #quiz-screen, #result-screen { display: none; width: 100%; }
        #menu-screen.active, #quiz-screen.active, #result-screen.active { display: block; }
        .category-card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 18px; }
        .option-btn { background-color: rgba(255,255,255,0.05); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 8px; text-align: left; }
        .correct { border-color: #4caf50; background-color: rgba(46, 125, 50, 0.3); }
        .wrong { border-color: #ef5350; background-color: rgba(198, 40, 40, 0.3); }
        .action-btn { width: 100%; background-color: var(--button-color); color: var(--button-text); border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div id="menu-screen" class="active">
        <div style="text-align:center; margin-bottom:20px;"><h1>ППП Справочник</h1></div>
        <div id="category-container"></div>
    </div>
    <div id="quiz-screen">
        <div onclick="showMenu()" style="color:var(--button-color); margin-bottom:10px; cursor:pointer;">← В меню</div>
        <div class="card">
            <div id="progress" style="font-size:12px; color:var(--hint-color); margin-bottom:10px;"></div>
            <div id="question" style="font-weight:600; margin-bottom:15px;"></div>
            <div id="options"></div>
            <div id="explanation" style="display:none; background:rgba(82, 136, 193, 0.15); padding:10px; border-radius:8px; margin-top:10px; font-size:14px;"></div>
            <button id="next-btn" class="action-btn" style="display:none; margin-top:15px;" onclick="nextQuestion()">Следующий</button>
        </div>
    </div>
    <div id="result-screen">
        <div class="card" style="text-align:center;">
            <h2>Тест завершён!</h2>
            <div id="score-display" style="font-size:30px; color:var(--button-color); margin:10px 0;"></div>
            <button class="action-btn" onclick="showMenu()">Вернуться в меню</button>
        </div>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp; tg.expand();
    const db = {
        police: { title: "Полиция", icon: "👮", questions: [
            { q: "Снимать полицейского можно?", o: ["Да", "Нет", "С разрешения", "Только без звука"], c: 0, e: "Деятельность полиции открыта." },
            { q: "Досмотр отличается от осмотра?", o: ["Ничем", "Наличием протокола и понятых", "Только местом", "Только временем"], c: 1, e: "Досмотр — это физическое исследование вещей с протоколом." },
            { q: "Срок задержания до суда?", o: ["3 часа", "24 часа", "48 часов", "Не ограничен"], c: 0, e: "По общему правилу — 3 часа." },
            { q: "Можно ли звонить при задержании?", o: ["Нет", "Да, 1 звонок", "Только адвокату", "Только с разрешения"], c: 1, e: "Да, право на 1 звонок близким в течение 3 часов." },
            { q: "Вход в квартиру без согласия?", o: ["Никогда", "Только для спасения жизни", "Всегда", "Для проверки документов"], c: 1, e: "Только в экстренных случаях." },
            { q: "Если нет удостоверения?", o: ["Подчиниться", "Позвонить 112", "Забрать значок", "Убежать"], c: 1, e: "Обязан показать по требованию." },
            { q: "Полицейский в роли понятого?", o: ["Да", "Нет, они заинтересованные лица", "Только ночью", "Если их двое"], c: 1, e: "Понятой должен быть независимым." },
            { q: "Несогласие с протоколом?", o: ["Не подписывать", "Написать 'Не согласен'", "Порвать", "Подписать молча"], c: 1, e: "Пишите свои возражения в протоколе." },
            { q: "Разблокировка телефона?", o: ["Обязаны", "Нет", "Только при краже", "Только несовершеннолетние"], c: 1, e: "Это тайна переписки." },
            { q: "Досмотр вещей?", o: ["Только сотрудником", "Только с понятыми", "Только в отделе", "Без ограничений"], c: 1, e: "Нужны понятые или видеозапись." }
        ]},
        army: { title: "Военкомат", icon: "🪖", questions: [
            { q: "Повестка через Реестр?", o: ["С момента открытия", "Через 7 дней", "Не считается", "Через месяц"], c: 1, e: "Через 7 дней с даты размещения." },
            { q: "Категория В?", o: ["Годен", "Ограниченно годен (запас)", "Отсрочка", "Не годен"], c: 1, e: "Зачисление в запас." },
            { q: "Категория Г?", o: ["Ничем не отличается", "Отсрочка до 12 мес", "Спецвойска", "Служба"], c: 1, e: "Временная отсрочка." },
            { q: "Представитель в военкомате?", o: ["Нельзя", "Да, по нотариальной доверенности", "Только адвокат", "Только родственник"], c: 1, e: "Можно по доверенности." },
            { q: "Штраф за неявку?", o: ["500р", "10-30 тысяч", "Уголовка", "100 тысяч"], c: 1, e: "От 10 до 30 тысяч рублей." },
            { q: "Полиция везет в военкомат?", o: ["Всегда", "Только по письменному обращению", "Никогда", "Только ночью"], c: 1, e: "Нужно письменное обращение." },
            { q: "Обжалование?", o: ["Нельзя", "В комиссию субъекта или суд", "Порвать дело", "Написать отказ"], c: 1, e: "Можно обжаловать." },
            { q: "Медобследование?", o: ["Добровольно", "Обязательно", "Только при желании", "Только с кат. А"], c: 1, e: "Обязательно для категории." },
            { q: "Из запаса на срочную?", o: ["Да", "Нет", "Только добровольно", "Только по сборам"], c: 1, e: "Нет, срочная служба только призывникам." },
            { q: "Выезд за границу?", o: ["При получении", "Со дня размещения повестки", "Только по суду", "Всегда"], c: 1, e: "Автоматически с даты размещения." }
        ]}
            auto: { title: "Авто", icon: "🚗", questions: [
            { q: "Остановка вне поста?", o: ["Запрещена", "Разрешена", "Только с понятыми", "Только ночью"], c: 1, e: "Разрешена." },
            { q: "Выход из авто?", o: ["Всегда", "Только при досмотре", "Никогда", "По просьбе"], c: 1, e: "При досмотре/отстранении." },
            { q: "Освидетельствование?", o: ["Только врач", "Инспектор или врач", "Никак", "Только суд"], c: 1, e: "На месте или у врача." },
            { q: "Отказ от врача?", o: ["Штраф 500р", "Лишение прав", "Ничего", "Арест"], c: 1, e: "Лишение прав." },
            { q: "Документы?", o: ["Через стекло", "В руки", "По фото", "По видео"], c: 1, e: "В руки." },
            { q: "Откройте багажник?", o: ["Досмотр (понятые)", "Осмотр", "Обыск", "Просьба"], c: 0, e: "Досмотр." },
            { q: "Съемка инспектора?", o: ["Запрещена", "Разрешена", "С согласия", "Только ночью"], c: 1, e: "Разрешена." },
            { q: "Штрафы?", o: ["Арест авто", "Задержание до 3 часов", "Ничего", "Лишение"], c: 1, e: "Задержание до 3 часов." },
            { q: "Без ОСАГО?", o: ["Эвакуация", "Штраф 800р", "Арест", "Лишение"], c: 1, e: "Штраф 800р." },
            { q: "Грязный номер?", o: ["Нечитаемый с 20м", "Любая грязь", "Только задний", "Только передний"], c: 0, e: "С 20 метров." }
        ]},
        bus: { title: "Транспорт", icon: "🚌", questions: [
            { q: "Сила контролера?", o: ["Да", "Нет", "Только в метро", "С полицией"], c: 1, e: "Нет прав на силу." },
            { q: "Высадка ребенка?", o: ["Можно", "Запрещено", "Только зимой", "С МВД"], c: 1, e: "Запрещено." },
            { q: "Паспорт контролеру?", o: ["Обязан", "Нет", "Только права", "Только в полицию"], c: 1, e: "Нет." },
            { q: "Телефон?", o: ["Можно отобрать", "Незаконно", "При проверке", "С понятыми"], c: 1, e: "Незаконно." },
            { q: "Чужая карта?", o: ["Ничего", "Изъятие и штраф", "Предупреждение", "Арест"], c: 1, e: "Изъятие." },
            { q: "Не работает валидатор?", o: ["Бесплатно", "Платить другим способом", "Выйти", "Можно не платить"], c: 1, e: "Платить другим способом." },
            { q: "Двери закрыты?", o: ["Законно", "Самоуправство", "По инструкции", "Только ночью"], c: 1, e: "Незаконно." },
            { q: "Штраф на месте?", o: ["Наличными", "По реквизитам", "Переводом", "Никак"], c: 1, e: "Только по реквизитам." },
            { q: "Досмотр сумки?", o: ["Да", "Нет", "С понятыми", "В отделе"], c: 1, e: "Нет." },
            { q: "Ждать полицию?", o: ["Обязан", "Не обязан", "До 3 часов", "В отделе"], c: 1, e: "Не обязан." }
        ]},
        scooter: { title: "Самокаты", icon: "🛴", questions: [
            { q: "Скорость?", o: ["15", "25", "40", "Не ограничена"], c: 1, e: "25 км/ч." },
            { q: "Вдвоем?", o: ["Можно", "Запрещено", "С ребенком", "Только на своем"], c: 1, e: "Запрещено." },
            { q: "Зебра?", o: ["Ехать", "Спешиться", "На зеленый", "Только с авто"], c: 1, e: "Спешиться." },
            { q: "Тротуар?", o: ["Приоритет самоката", "Приоритет пешехода", "Равно", "Только ночью"], c: 1, e: "Приоритет пешехода." },
            { q: "Права?", o: ["Да", "Нет", "С 21 года", "Только на скутер"], c: 1, e: "Нет." },
            { q: "Дорога?", o: ["Всегда", "С 14 лет", "Только ночью", "Никогда"], c: 1, e: "С 14 лет." },
            { q: "Пьяный?", o: ["Можно", "Запрещено", "До 0.5", "Только на авто"], c: 1, e: "Запрещено." },
            { q: "ДПС?", o: ["Нет", "Да", "Только ППС", "Только в отделе"], c: 1, e: "Да." },
            { q: "Вес?", o: ["До 20кг", "До 35кг", "До 50кг", "Без лимита"], c: 1, e: "До 35кг." },
            { q: "Поворот налево?", o: ["Можно", "Запрещено", "Только ночью", "С поворотником"], c: 1, e: "Запрещено." }
        ]}
    };
    let curData = [], curQ = 0, score = 0;
    function showMenu() { document.getElementById('menu-screen').className='active'; document.getElementById('quiz-screen').className=''; document.getElementById('result-screen').className=''; }
    function start(k) { curData = db[k].questions.sort(()=>Math.random()-0.5); curQ = 0; score = 0; document.getElementById('menu-screen').className=''; document.getElementById('quiz-screen').className='active'; loadQ(); }
    function loadQ() { let q = curData[curQ]; document.getElementById('progress').innerText = `Вопрос ${curQ+1}/10`; document.getElementById('question').innerText = q.q; let h = ''; q.o.forEach((o, i) => h += `<button class="option-btn" onclick="check(${i}, ${q.c}, '${q.e}')">${o}</button>`); document.getElementById('options').innerHTML = h; document.getElementById('next-btn').style.display='none'; document.getElementById('explanation').style.display='none'; }
    function check(s, c, e) { document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled=true; b.className='option-btn '+(i==c?'correct':'wrong'); }); document.getElementById('explanation').innerText = e; document.getElementById('explanation').style.display='block'; document.getElementById('next-btn').style.display='block'; if(s==c) score++; }
    function nextQuestion() { curQ++; if(curQ < 10) loadQ(); else { document.getElementById('quiz-screen').className=''; document.getElementById('result-screen').className='active'; document.getElementById('score-display').innerText = score + "/10"; } }
    Object.keys(db).forEach(k => document.getElementById('category-container').innerHTML += `<div class="category-card" onclick="start('${k}')"><div>${db[k].icon}</div><div style="margin-left:15px;">${db[k].title}</div></div>`);
</script>
</body>
</html>
