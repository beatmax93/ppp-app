<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>ППП Справочник</title>
<style>body{background:#17212b;color:#fff;padding:15px;font-family:sans-serif;} .card{background:#232e3c;padding:15px;border-radius:10px;margin-bottom:10px;} .btn{background:#5288c1;padding:10px;border-radius:8px;margin-top:5px;cursor:pointer;border:none;color:#fff;width:100%;}</style></head>
<body><h2>ППП Справочник</h2><div id="app"></div><script>
function render(title, qs) {
    let html = `<h3>${title}</h3>`;
    qs.sort(() => Math.random() - 0.5).forEach((i, idx) => {
        html += `<div class='card'>${idx+1}. ${i.q}`;
        i.o.forEach((o, optIdx) => html += `<button class='btn' onclick="alert('${optIdx==i.a ? 'Верно! '+i.l : 'Неверно. '+i.l}')">${o}</button>`);
        html += `</div>`;
    });
    document.getElementById('app').innerHTML += html;
}
    render("Полиция", [
    {q:"Требуют телефон?", o:["Отдать","Протокол/понятые"], a:1, l:"ст. 27.7 КоАП"},
    {q:"Представиться?", o:["Не обязаны","Обязаны"], a:1, l:"ст. 5 ФЗ 'О полиции'"},
    {q:"Хамит?", o:["Терпеть","Видео"], a:1, l:"ст. 8 ФЗ"},
    {q:"Беседа в отделе?", o:["Идти","Только задержанным"], a:1, l:"ст. 14 ФЗ"},

    {q:"Причина остановки?", o:["Молчать","Требовать основания"], a:1, l:"ст. 5 ФЗ"}
]);

    {q:"Забор паспорта?", o:["Да","Незаконно"], a:1, l:"Полож. о паспорте"}
]);
