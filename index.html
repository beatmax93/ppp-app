


<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП Справочник</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .cat-card { background: #1e1e1e; padding: 20px; border-radius: 15px; margin-bottom: 15px; cursor: pointer; border: 1px solid #333; }
        .btn { background: #333; color: #fff; border: none; padding: 15px; border-radius: 8px; margin-top: 10px; cursor: pointer; width: 100%; text-align: left; font-size: 16px; }
        .btn:hover { background: #444; }
        .res-box { padding: 15px; margin-top: 15px; border-radius: 8px; font-size: 14px; }
        .correct { background: #1b4332; }
        .wrong { background: #780000; }
    </style>
</head>
<body>

<div id="menu">
    <h2 style="text-align:center">ППП Справочник</h2>
    <p style="text-align:center; color:#888">Выберите ситуацию для проверки знаний</p>
    <div id="cats"></div>
</div>

<div id="quiz" style="display:none;">
    <button onclick="location.reload()" style="background:none; border:none; color:#5288c1; cursor:pointer;">← Назад к меню</button>
    <div id="q-container"></div>
</div>

<script>
const data = [
    { id: "police", title: "Полиция на улице", desc: "Проверка документов, досмотр, задержание", qs: [
        {q:"Сотрудник требует разблокировать телефон. Что делать?", o:["Разблокировать и показать", "Отказать, требуя протокол досмотра и 2 понятых"], a:1, res:"ст. 27.7 КоАП РФ: Досмотр личных вещей требует обязательного составления протокола и участия двух понятых."},
        {q:"Сотрудник остановил и не представился. Как быть?", o:["Игнорировать требования", "Вежливо потребовать представиться, назвать должность и причину"], a:1, res:"ст. 5 ФЗ 'О полиции': Сотрудник обязан представиться, назвать звание и причину остановки."},
        {q:"Вас приглашают в отдел 'для беседы'. Обязаны ли идти?", o:["Да, всегда", "Только при наличии повестки или задержания"], a:1, res:"ст. 14 ФЗ 'О полиции': Без законных оснований (повестка, задержание) вы не обязаны следовать в отдел."},
        {q:"Сотрудник хамит. Ваши действия?", o:["Хамить в ответ", "Фиксировать на видео, спросить жетон и звонить в дежурную часть"], a:1, res:"ст. 8 ФЗ 'О полиции': Деятельность полиции является открытой, действия можно фиксировать, а на нарушение жаловаться."},
        {q:"Дают пустой протокол на подпись. Что делать?", o:["Подписать, чтобы отпустили", "Перечеркнуть пустые места и написать 'не согласен'"], a:1, res:"ст. 28.2 КоАП РФ: Заполнение пустых строк после вашей подписи незаконно."},
        {q:"Обыск без понятых (или видео). Законно?", o:["Да, это норма", "Нет, это грубое нарушение процедуры"], a:1, res:"ст. 27.7 КоАП РФ: Личный досмотр без понятых или видеофиксации незаконен."},
        {q:"Требуют паспорт в руки. Обязаны дать?", o:["Да, обязан", "Нет, показать в развернутом виде"], a:1, res:"ст. 5 ФЗ 'О полиции': Закон не обязывает передавать паспорт в руки, достаточно предъявить его для обозрения."},
        {q:"Телефон изымают. Какова процедура?", o:["Просто отдать", "Требовать протокол изъятия, двух понятых и опись"], a:1, res:"ст. 27.10 КоАП РФ: Изъятие вещей оформляется протоколом с участием понятых."},
        {q:"Задержали. Имеете ли право на звонок?", o:["Нет", "Да, для уведомления близких в течение 3 часов"], a:1, res:"ст. 14 ФЗ 'О полиции': Задержанный имеет право на уведомление родственников в кратчайший срок."},
        {q:"Ссылаются на 'рейд'. Обязаны ли подчиняться?", o:["Да, в рейде все можно", "Только если требования законны"], a:1, res:"ст. 5 ФЗ 'О полиции': Любое требование должно быть основано на законе, независимо от статуса мероприятия."}
    ]},
    { id: "auto", title: "Авто и ГИБДД", desc: "ПДД, алкотестер, остановка вне поста", qs: [
        {q:"Инспектор просит выйти из машины и сесть в патрульную. Обязаны?", o:["Да, обязан", "Только при досмотре или задержании"], a:1, res:"Регламент МВД: Выход из авто обязателен только в строго определенных случаях (досмотр, задержание)."},
        {q:"Остановка вне стационарного поста. Законно?", o:["Нет", "Да, инспектор имеет право"], a:1, res:"ПДД п. 6.11: Инспектор имеет право остановить ТС в любом месте при наличии законных оснований."},
        {q:"Требуют дыхнуть в трубочку. Ваши действия?", o:["Дыхнуть", "Требовать официальное медосвидетельствование"], a:1, res:"ст. 27.12 КоАП: Вы имеете право отказаться от проверки на месте в пользу официального медосвидетельствования."},
        {q:"Досмотр бардачка. Как быть?", o:["Открыть самому", "Требовать протокол и понятых"], a:1, res:"ст. 27.9 КоАП: Досмотр салона требует составления протокола и привлечения понятых."},
        {q:"Передача документов в руки. Обязаны?", o:["Да, обязан", "Нет, показать через стекло"], a:0, res:"ПДД п. 2.1.1: Водитель обязан передать документы для проверки сотруднику полиции."},
        {q:"Штраф наличными на месте. Законно?", o:["Да", "Нет, только через банк"], a:1, res:"ст. 32.2 КоАП: Оплата штрафа на месте наличными запрещена законом."},
        {q:"Инспектор проверяет документы. Законно?", o:["Да", "Нет, только если нарушил"], a:0, res:"Регламент МВД: Проверка документов разрешена в любом месте, если есть основания."},
        {q:"Инспектор хамит/угрожает. Что делать?", o:["Молчать", "Звонить на телефон доверия МВД"], a:1, res:"ФЗ 'О полиции': Каждый имеет право на обжалование действий сотрудника по телефону доверия."},
        {q:"Инспектор без жетона. Что делать?", o:["Записать данные, требовать жетон", "Ничего"], a:1, res:"ФЗ 'О полиции': Сотрудник обязан иметь нагрудный знак (жетон), позволяющий его идентифицировать."},
        {q:"Просят открыть багажник. Ваши действия?", o:["Открыть", "Требовать протокол и понятых"], a:1, res:"ст. 27.9 КоАП: Любой досмотр багажника — это процессуальное действие, требующее протокола."}
    ]},
    { id: "bus", title: "Контролёры (Транспорт)", desc: "Оплата, штрафы, задержания", qs: [
        {q:"Контролер требует паспорт в руки. Обязаны?", o:["Да, обязан", "Нет, показать без передачи"], a:1, res:"ФЗ-259: Паспорт достаточно предъявить в развернутом виде для подтверждения личности."},
        {q:"Двери заблокировали до уплаты штрафа. Действия?", o:["Платить", "Требовать открытия, это незаконное удержание"], a:1, res:"ст. 127 УК РФ: Незаконное лишение свободы (удержание в ТС) запрещено."},
        {q:"Требуют штраф наличкой. Законно?", o:["Да", "Нет, только официальная квитанция"], a:1, res:"ФЗ-259: Оплата штрафа возможна только через официальные платежные системы."},
        {q:"Контролер хамит/применяет силу. Как быть?", o:["Дать сдачи", "Снимать на видео, заявить о превышении полномочий"], a:1, res:"ст. 116 УК РФ: Насилие со стороны контролера квалифицируется как нарушение закона."},
        {q:"Нет билета, грозят полицией. Что делать?", o:["Бояться", "Пусть вызывают, вы обязаны дать данные для акта"], a:1, res:"ФЗ 'О полиции': Полиция обязана пресекать нарушения, а вы — предоставить данные для составления протокола."},
        {q:"Имеете право снимать контролера?"," o:["Нет", "Да"], a:1, res:"ГК РФ ст. 152.1: Съемка в публичном месте не запрещена, если это не нарушает права человека."},
        {q:"Высадка на неудобной остановке. Обязаны выйти?", o:["Да", "Требовать остановки на законной остановке"], a:1, res:"Правила перевозок: Высадка должна производиться только на предусмотренных законом остановках."},
        {q:"Контролер не показал удостоверение. Что делать?", o:["Верить на слово", "Отказываться от диалога"], a:1, res:"ФЗ-259: Любое требование контролера законно только после предъявления удостоверения."},
        {q:"Штраф кажется завышенным. Что делать?", o:["Платить", "Требовать ссылку на закон"], a:1, res:"КоАП субъектов: Штрафы устанавливаются региональными законами, требуйте обоснования."},
        {q:"Вас пытаются высадить ночью в безлюдном месте. Что делать?", o:["Выйти", "Требовать проезда до освещенного места/полиции"], a:1, res:"ст. 127 УК РФ: Принудительная высадка в опасных условиях незаконна."}
    ]},
    { id: "scooter", title: "Электросамокаты (СИМ)", desc: "ПДД, тротуары, штрафы", qs: [
        {q:"Езда вдвоем. Что будет?", o:["Ничего", "Нарушение, штраф"], a:1, res:"ПДД п. 24.8: Запрещено перевозить пассажиров на СИМ."},
        {q:"Где ехать?", o:["Проезжая часть", "Тротуар (если нет велодорожки)"], a:1, res:"ПДД п. 24.2: При отсутствии велодорожек движение разрешено по тротуарам."},
        {q:"Скорость ограничена?", o:["Нет", "Да, до 25 км/ч"], a:1, res:"ПДД п. 24.6: Максимальная скорость движения на СИМ — 25 км/ч."},
        {q:"Алкоголь и самокат. Можно?", o:["Да", "Нет, запрещено"], a:1, res:"ст. 12.29 КоАП: Запрещено управление СИМ в состоянии опьянения."},
        {q:"Сбили пешехода. Кто виноват?", o:["Пешеход", "Самокатчик"], a:1, res:"ГК РФ ст. 1079: Самокатчик несет ответственность как владелец средства повышенной опасности."},
        {q:"Зебра. Ваши действия?", o:["Проехать", "Спешиться"], a:1, res:"ПДД п. 24.8: На пешеходном переходе нужно спешиться и перейти пешком."},
        {q:"Можно ли на магистраль?", o:["Да", "Нет"], a:1, res:"ПДД п. 16.1: Движение СИМ по автомагистралям запрещено."},
        {q:"Парковка где угодно. Что грозит?", o:["Ничего", "Штраф"], a:1, res:"КоАП субъектов: За нарушение правил парковки предусмотрены административные штрафы."},
        {q:"Нужны ли права?", o:["Да", "Нет"], a:1, res:"ФЗ-196: Для управления обычным СИМ водительское удостоверение не требуется."},
        {q:"Вес >35кг. Что это?", o:["СИМ", "Приравнен к мопеду"], a:1, res:"ПДД РФ: СИМ весом более 35кг приравнивается к мопеду, нужны права категории М."}
    ]}
];

let currentCat = null;
let currentQIdx = 0;

function startQuiz(id) {
    currentCat = data.find(c => c.id === id);
    currentCat.qs.sort(() => Math.random() - 0.5);
    currentQIdx = 0;
    document.getElementById('menu').style.display = 'none';
    document.getElementById('quiz').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    const container = document.getElementById('q-container');
    const item = currentCat.qs[currentQIdx];
    let h = `<h3>${currentCat.title} (${currentQIdx+1}/10)</h3><div class='cat-card'><b>${item.q}</b>`;
    item.o.forEach((o, i) => {
        h += `<button class='btn' onclick="check(${i})">${o}</button>`;
    });
    container.innerHTML = h + `</div>`;
}

function check(answerIdx) {
    const item = currentCat.qs[currentQIdx];
    const isCorrect = answerIdx === item.a;
    const container = document.getElementById('q-container');
    
    let h = `<div class='cat-card'><b>${item.q}</b><div class='res-box ${isCorrect ? 'correct' : 'wrong'}'>${isCorrect ? '✅ Правильно!' : '❌ Неверно.'} ${item.res}</div>`;
    h += `<button class='btn' onclick="next()">Далее →</button></div>`;
    container.innerHTML = h;
}

function next() {
    currentQIdx++;
    if (currentQIdx < 10) showQuestion();
    else {
        document.getElementById('q-container').innerHTML = `<h3>Тест завершен</h3><button class='btn' onclick='location.reload()'>Вернуться в меню</button>`;
    }
}

const catsDiv = document.getElementById('cats');
data.forEach(c => {
    catsDiv.innerHTML += `<div class="cat-card" onclick="startQuiz('${c.id}')"><h3>${c.title}</h3><p>${c.desc}</p></div>`;
});
</script>

</body>
</html>
