<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП — Справочник</title>
    <style>
        :root { --bg-color: #17212b; --text-color: #f5f5f5; --card-bg: #232e3c; --button-color: #5288c1; --hint-color: #7f91a4; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        #menu-screen, #quiz-screen, #result-screen {
    display: none;
    max-height: 400px;
    overflow-y: auto;
        }
        .active { display: block !important; }
        .category-card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; }
        .option-btn { background: rgba(255, 255, 255, 0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; }
        .correct { background: rgba(46, 125, 50, 0.3) !important; border-color: #4caf50; }
        .wrong { background: rgba(198, 40, 40, 0.3) !important; border-color: #ef5350; }
        .explanation { margin-top: 14px; padding: 12px; border-radius: 8px; background: rgba(82, 136, 193, 0.15); display: none; }
        .action-btn { width: 100%; background: var(--button-color); border: none; padding: 14px; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div id="menu-screen" class="active">
        <h1>ППП Справочник</h1>
        <div id="category-container"></div>
    </div>
    <div id="quiz-screen">
        <div onclick="showMenu()" style="color:var(--button-color); cursor:pointer;">← В меню</div>
        <div class="card" style="margin-top:10px;">
            <div id="progress" style="color:var(--hint-color); font-size:12px;"></div>
            <h3 id="question"></h3>
            <div id="options"></div>
            <div id="explanation" class="explanation"></div>
            <button id="next-btn" class="action-btn" onclick="nextQuestion()" style="display:none;">Следующий вопрос</button>
        </div>
    </div>
    <div id="result-screen">
        <h2>Тест завершён!</h2>
        <div id="score-display" style="font-size:24px; font-weight:bold; margin:20px 0;"></div>
        <button class="action-btn" onclick="showMenu()">В меню</button>
    </div>
</div>

<script>
    const db = {
        police: { title: "Полиция", icon: "👮", questions: [
            {q: "Обязаны ли вы передавать паспорт сотруднику в руки?", o: ["Да, обязан", "Нет, достаточно показать в развернутом виде"], c: 1, e: "Закон не обязывает передавать паспорт, достаточно предъявить его для обозрения (ст. 5 ФЗ 'О полиции')."},
            {q: "Можно ли снимать полицейского на видео?", o: ["Да", "Нет"], c: 0, e: "Деятельность полиции является открытой (ст. 8 ФЗ 'О полиции')."},
            {q: "Досмотр вещей без понятых законен?", o: ["Да", "Нет"], c: 1, e: "Личный досмотр требует участия двух понятых или видеофиксации (ст. 27.7 КоАП РФ)."},
            {q: "Обязаны ли идти в отдел 'для беседы' без повестки?", o: ["Да", "Нет"], c: 1, e: "Вы не обязаны следовать в отдел без законных оснований (задержание, повестка)."},
            {q: "Может ли полицейский требовать разблокировку телефона?", o: ["Да", "Нет"], c: 1, e: "Доступ к личным данным телефона без решения суда незаконен."},
            {q: "Что делать, если требуют подписать пустой протокол?", o: ["Подписать", "Перечеркнуть пустые места и написать 'не согласен'"], c: 1, e: "Пустой протокол — это грубое нарушение процедуры (ст. 28.2 КоАП РФ)."},
            {q: "Имеет ли право полицейский не представляться?", o: ["Да", "Нет"], c: 1, e: "Сотрудник обязан представиться, назвать должность и причину остановки (ст. 5 ФЗ)."},
            {q: "Имеете ли вы право на 1 звонок при задержании?", o: ["Да", "Нет"], c: 0, e: "Задержанный имеет право на уведомление родственников в течение 3 часов (ст. 14 ФЗ)."},
            {q: "Можно ли фиксировать действия полиции в рейде?", o: ["Нет", "Да"], c: 1, e: "Статус рейда не отменяет права гражданина фиксировать действия полиции."},
            {q: "Понятыми могут быть сами полицейские?", o: ["Да", "Нет"], c: 1, e: "Понятой должен быть независимым лицом, не заинтересованным в исходе дела."}
        ]},
        army: { title: "Военкомат", icon: "🪖", questions: [
            {q: "Повестка вручена не лично. Законно?", o: ["Да", "Нет"], c: 1, e: "Повестка должна вручаться лично под расписку (ст. 31 ФЗ-53)."},
            {q: "Отказ от подписи в повестке?", o: ["Ничего не будет", "Составят акт об отказе, будет считаться врученной"], c: 1, e: "Отказ не избавляет от ответственности, составляется акт."},
            {q: "Изъятие телефона в военкомате?", o: ["Законно", "Незаконно без протокола"], c: 1, e: "Изымать личное имущество без протокола и понятых нельзя."},
            {q: "Принудительный привод в военкомат полицией?", o: ["Всегда", "Только по письменному определению военкома"], c: 1, e: "Произвольное доставление незаконно, нужна правовая процедура."},
            {q: "Категория 'В' это:", o: ["Годен", "Ограниченно годен, запас"], c: 1, e: "Освобождает от срочной службы в мирное время (ст. 28 ФЗ-53)."},
            {q: "Можно ли обжаловать решение медкомиссии?", o: ["Нет", "Да, в суд или комиссию субъекта"], c: 1, e: "Решение комиссии можно обжаловать в течение 3 месяцев."},
            {q: "Повестка в электронном виде:", o: ["Не имеет силы", "Считается врученной через 7 дней в Реестре"], c: 1, e: "Электронная повестка приравнивается к бумажной."},
            {q: "Нужно ли идти в военкомат при смене места жительства?", o: ["Нет", "Да"], c: 1, e: "Обязаны встать на учет по новому месту в течение 2 недель."},
            {q: "Право на представителя по доверенности?", o: ["Нет", "Да"], c: 1, e: "Представитель с нотариальной доверенностью может действовать от вашего имени."},
            {q: "Отказ от медосвидетельствования?", o: ["Можно", "Незаконно"], c: 1, e: "При отказе от обследования комиссия может принять решение без учета заболевания."}
        ]},
        auto: { title: "Авто и ГИБДД", icon: "🚗", questions: [
            {q: "Остановка авто вне поста?", o: ["Запрещена", "Разрешена"], c: 1, e: "Инспектор имеет право остановить ТС в любом месте при законных основаниях."},
            {q: "Обязан ли выходить из авто?", o: ["Всегда", "Только при досмотре или задержании"], c: 1, e: "В остальных случаях это лишь просьба инспектора."},
            {q: "Досмотр багажника без протокола?", o: ["Можно", "Незаконно"], c: 1, e: "Любой досмотр багажника — процессуальное действие (ст. 27.9 КоАП)."},
            {q: "Передача документов в руки?", o: ["Обязан", "Нет, только показать"], c: 0, e: "ПДД п. 2.1.1 требует передать документы для проверки."},
            {q: "Отказ от 'дыхнуть' на месте?", o: ["Лишение", "Право на официальное медосвидетельствование"], c: 1, e: "Вы имеете право ехать к врачу при несогласии с прибором."},
            {q: "Оплата штрафа наличными?", o: ["Запрещена", "Разрешена"], c: 0, e: "Оплата штрафа на месте наличными запрещена (ст. 32.2 КоАП)."},
            {q: "Инспектор без жетона?", o: ["Норма", "Нарушение ФЗ"], c: 1, e: "Сотрудник обязан иметь нагрудный знак для идентификации."},
            {q: "Видеосъемка инспектора?", o: ["Запрещена", "Разрешена"], c: 1, e: "Съемка действий госслужащего при исполнении разрешена."},
            {q: "Эвакуация за отсутствие ОСАГО?", o: ["Да", "Нет"], c: 1, e: "За отсутствие ОСАГО только штраф 800 рублей."},
            {q: "Нечитаемый номер?", o: ["Штраф", "Предупреждение"], c: 0, e: "Если с 20 метров не видно хотя бы 1 символ, это штраф."}
        ]},
        bus: { title: "Транспорт", icon: "🚌", questions: [
            {q: "Контролер требует паспорт в руки?", o: ["Обязан", "Нет, показать без передачи"], c: 1, e: "Контролер не сотрудник полиции, права изымать паспорт нет."},
            {q: "Блокировка дверей до оплаты штрафа?", o: ["Законна", "Незаконна (удержание)"], c: 1, e: "Удержание пассажиров в ТС против воли — нарушение УК РФ."},
            {q: "Штраф наличкой контролеру?", o: ["Обязан платить", "Незаконно"], c: 1, e: "Оплата штрафа только через официальные квитанции/банки."},
            {q: "Контролер силой высаживает?", o: ["Имеет право", "Превышение полномочий"], c: 1, e: "Контролер не имеет права применять физическую силу."},
            {q: "Высадка ребенка до 16 лет?", o: ["Можно", "Запрещено законом"], c: 1, e: "Высаживать детей до 16 лет без взрослых строго запрещено."},
            {q: "Съемка контролера?", o: ["Нельзя", "Можно"], c: 1, e: "Съемка в публичном месте не запрещена."},
            {q: "Обязан ли ждать полицию по требованию контролера?", o: ["Обязан", "Не обязан"], c: 1, e: "У контролера нет полномочий задержания гражданина."},
            {q: "Валидатор не работает?", o: ["Бесплатно", "Оплатить другим способом"], c: 1, e: "Вы обязаны оплатить проезд иными доступными способами."},
            {q: "Контролер не показал удостоверение?", o: ["Обязан подчиниться", "Отказ от диалога"], c: 1, e: "Требования контролера законны только после предъявления ID."},
            {q: "Высадка в опасном месте?", o: ["Законно", "Незаконно (угроза жизни)"], c: 1, e: "Принудительная высадка в опасных условиях незаконна."}
        ]},
        scooter: { title: "Самокаты (СИМ)", icon: "🛴", questions: [
            {q: "Езда вдвоем?", o: ["Можно", "Запрещено"], c: 1, e: "Запрещено перевозить пассажиров на СИМ."},
            {q: "Зебра на самокате?", o: ["Проехать", "Спешиться"], c: 1, e: "На пешеходном переходе нужно идти пешком (ПДД 24.8)."},
            {q: "Скорость до:", o: ["25 км/ч", "40 км/ч"], c: 0, e: "Максимальная скорость движения на СИМ — 25 км/ч."},
            {q: "Алкоголь и самокат?", o: ["Можно", "Запрещено"], c: 1, e: "Управление СИМ в нетрезвом виде запрещено."},
            {q: "Приоритет на тротуаре?", o: ["У самоката", "У пешехода"], c: 1, e: "На тротуаре пешеходы имеют абсолютный приоритет."},
            {q: "Нужны ли права?", o: ["Да", "Нет (на обычные СИМ)"], c: 1, e: "На СИМ до 250 Вт права не нужны."},
            {q: "Езда по магистралям?", o: ["Можно", "Запрещено"], c: 1, e: "Движение СИМ по автомагистралям запрещено (ПДД 16.1)."},
            {q: "Остановка ДПС?", o: ["Не имеют права", "Имеют право"], c: 1, e: "Самокатчик — полноценный участник движения."},
            {q: "Масса > 35 кг?", o: ["Это СИМ", "Приравнен к мопеду"], c: 1, e: "Свыше 35 кг — нужны права категории М."},
            {q: "Поворот налево на многополосной?", o: ["Можно", "Запрещено (нужно идти пешком)"], c: 1, e: "Поворот налево для СИМ запрещен (ПДД 24.8)."}
        ]}
    };
<div id="articles-section" style="margin-top: 20px; padding: 15px; background: #2c3e50; border-radius: 8px;">
    <h3 style="color: #ffffff; margin-bottom: 10px; font-size: 18px;">Правовая база (Памятка)</h3>
    
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>1. Ст. 51 Конституции РФ:</strong> Никто не обязан свидетельствовать против себя, своего супруга и близких родственников.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>2. Ст. 5 Закона «О полиции»:</strong> Сотрудник обязан представиться, назвать должность, звание и фамилию, предъявить удостоверение.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>3. Ст. 14 ФЗ «О полиции»:</strong> Задержание возможно только при наличии законных оснований; ты имеешь право на один телефонный звонок.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>4. Ст. 13 Закона «О полиции»:</strong> Полиция имеет право проверять документы только при подозрении в совершении правонарушения.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>5. Ст. 27.2 КоАП РФ:</strong> Доставление — это принудительное препровождение в служебное помещение для составления протокола.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>6. Ст. 27.7 КоАП РФ:</strong> Личный досмотр проводится в присутствии двух понятых либо под видеозапись.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>7. Ст. 27.10 КоАП РФ:</strong> Изъятие вещей (телефона и т.д.) оформляется отдельным протоколом или записью в протоколе о досмотре.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>8. Ст. 1.5 КоАП РФ:</strong> Презумпция невиновности: лицо считается невиновным, пока его вина не будет доказана.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>9. Ст. 33 Конституции РФ:</strong> Право направлять личные обращения в государственные органы.
    </div>
    <div style="color: #cccccc; padding: 8px 0; border-bottom: 1px solid #3e5871; font-size: 14px;">
        <strong>10. Ст. 27.5 КоАП РФ:</strong> Срок административного задержания не должен превышать 3 часов (в исключительных случаях — до 48 часов).
    </div>
</div>
    
    let currentQuestionsList = [];
    let currentQuestion = 0;
    let score = 0;

    function initMenu() {
        const container = document.getElementById('category-container');
        for (let key in db) {
            const div = document.createElement('div');
            div.className = 'category-card';
            div.onclick = () => startCategory(key);
            div.innerHTML = `<div>${db[key].icon}</div><div style="margin-left:15px;"><h3>${db[key].title}</h3></div>`;
            container.appendChild(div);
        }
    }

    function startCategory(key) {
        currentQuestionsList = [...db[key].questions].sort(() => Math.random() - 0.5);
        currentQuestion = 0; score = 0;
        document.getElementById('menu-screen').className = '';
        document.getElementById('quiz-screen').className = 'active';
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestionsList[currentQuestion];
        document.getElementById('progress').innerText = `Вопрос ${currentQuestion + 1} из ${currentQuestionsList.length}`;
        document.getElementById('question').innerText = q.q;
        const opts = document.getElementById('options');
        opts.innerHTML = '';
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        q.o.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = opt;
            b.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                if (i === q.c) { b.classList.add('correct'); score++; } else { b.classList.add('wrong'); }
                const exp = document.getElementById('explanation');
                exp.innerText = q.e; exp.style.display = 'block';
                document.getElementById('next-btn').style.display = 'block';
            };
            opts.appendChild(b);
        });
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < currentQuestionsList.length) loadQuestion();
        else {
            document.getElementById('quiz-screen').className = '';
            document.getElementById('result-screen').className = 'active';
            document.getElementById('score-display').innerText = `${score} / ${currentQuestionsList.length}`;
        }
    }

    function showMenu() {
        document.getElementById('quiz-screen').className = '';
        document.getElementById('result-screen').className = '';
        document.getElementById('menu-screen').className = 'active';
    }    
    function donateStar() {
        window.Telegram.WebApp.sendData(JSON.stringify({action: "donate", amount: 1}));
    }
    initMenu();
</script>
    
</body>
</html>
