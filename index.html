<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП Справочник</title>
    <style>
        body { font-family: sans-serif; background: #17212b; color: #fff; margin: 0; padding: 15px; }
        .card { background: #232e3c; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { background: #5288c1; color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; }
        .option { background: #1c2733; border: 1px solid #334455; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    </style>
</head>
<body>
<div id="m">
    <h2 style="text-align:center">Выберите ситуацию</h2>
    <div id="list"></div>
</div>
<div id="q-area" style="display:none">
    <button class="btn" onclick="location.reload()">← Назад</button>
    <div id="content"></div>
</div>
<script>
const db = {
    police: {t:"Полиция", q:[
        {q:"Требуют телефон?", o:["Отдать","Требовать протокол"], a:1, e:"Осмотр без понятых и протокола незаконен."},
        {q:"Первый вопрос при встрече?", o:["Куда идешь?","Предъявите удостоверение"], a:1, e:"Требуй представиться и показать удостоверение."},
        {q:"Хамит?", o:["Хамить в ответ","Снимать на видео"], a:1, e:"Видео — твой главный свидетель."},
        {q:"Приглашают на беседу?", o:["Идти","Не обязан без статуса задержанного"], a:1, e:"Нет статуса — нет обязательств."},
        {q:"Угрожают протоколом?", o:["Подписать","Требовать адвоката"], a:1, e:"Не подписывай пустое. Пиши 'не согласен'."},
        {q:"Досмотр без понятых?", o:["Норма","Нарушение закона"], a:1, e:"Досмотр без понятых незаконен."},
        {q:"Носить паспорт?", o:["Всегда","Не обязан, но лучше иметь при себе"], a:1, e:"По закону не обязан, но ускорит проверку."},
        {q:"Забрать телефон в отделе?", o:["Да","Только при изъятии с протоколом"], a:1, e:"Только с понятыми и протоколом."},
        {q:"Право на звонок?", o:["Нет","Да, в течение 3 часов"], a:1, e:"Обязаны дать право на звонок."},
        {q:"Причина остановки?", o:["Молчать","Требовать правовые основания"], a:1, e:"Требуй озвучить основания."}
    ]},
    army: {t:"Военкомат", q:[
        {q:"Повестка в Госуслугах?", o:["Идти","Считать врученной через 7 дней"], a:1, e:"Юридически через 7 дней."},
        {q:"Мобилизация при негодности?", o:["Сдаться","Обжаловать"], a:1, e:"Обжалуй решение с документами."},
        {q:"Повестка в ящике?", o:["Идти","Игнорировать"], a:1, e:"Должна быть вручена лично."},
        {q:"Отказ принимать справки?", o:["Сдаться","Заказным письмом"], a:1, e:"Только официальная переписка."},
        {q:"Забрать из военкомата?", o:["Нет","Да после комиссии"], a:1, e:"Только после решения комиссии."},
        {q:"Альтернативная служба?", o:["Нет","Да (заявление за полгода)"], a:1, e:"Заявление нужно подавать заранее."},
        {q:"Медкомиссия?", o:["Военком","Профильные врачи"], a:1, e:"Только профильные врачи."},
        {q:"Съемка в военкомате?", o:["Да","Нет, это режимный объект"], a:1, e:"Съемка запрещена."},
        {q:"Призвали с болезнью?", o:["Служить","Подавать в суд"], a:1, e:"Иск в суд приостанавливает призыв."},
        {q:"Паспорт?", o:["Сдать","Запрещено забирать"], a:1, e:"Паспорт забирать запрещено."}
    ]},
    auto: {t:"ГИБДД", q:[
        {q:"Остановка вне поста?", o:["Запрещено","Разрешено"], a:1, e:"Разрешено законом."},
        {q:"Выйти из авто?", o:["Обязан","Только при досмотре"], a:1, e:"Только при необходимости действий."},
        {q:"Дунуть в трубочку?", o:["Соглашаюсь","Требую врачей"], a:1, e:"Требуй медосвидетельствования."},
        {q:"Лезет в бардачок?", o:["Помогаю","Требую понятых"], a:1, e:"Досмотр без владельца незаконен."},
        {q:"Документы?", o:["Передать","Показать издалека"], a:1, e:"Обязан передать."},
        {q:"Штраф на месте?", o:["Плачу","Только через банк"], a:1, e:"Инспектор не принимает деньги."},
        {q:"Проверка документов?", o:["Законно","Незаконно"], a:1, e:"Законное основание."},
        {q:"Инспектор хамит?", o:["Бить","Звонить на горячую линию"], a:1, e:"Горячая линия — лучший способ."},
        {q:"Жетон?", o:["Да","Нет"], a:1, e:"Обязан иметь жетон."},
        {q:"Сесть в машину инспектора?", o:["Обязан","Не садиться без приглашения"], a:1, e:"Не садись без приглашения."}
    ]},
    bus: {t:"Транспорт", q:[
        {q:"Паспорт контролеру?", o:["Дать","Только полиции"], a:1, e:"Только сотрудники полиции."},
        {q:"Высадка ребенка?", o:["Выйти","Вызвать полицию"], a:1, e:"Высадка ребенка запрещена."},
        {q:"Блокировка дверей?", o:["Норма","Незаконное удержание"], a:1, e:"Удержание — статья УК РФ."},
        {q:"Штраф на месте?", o:["Дать деньги","Только по квитанции"], a:1, e:"Никаких денег на месте."},
        {q:"Сила контролера?", o:["Терпеть","Полиция"], a:1, e:"Применение силы — нападение."},
        {q:"Нет билета?", o:["Скандал","Назвать данные"], a:1, e:"Спокойно предоставь данные."},
        {q:"Съемка контролера?", o:["Запрещено","Разрешено"], a:1, e:"Съемка в общественном месте разрешена."},
        {q:"Выход?", o:["До конца","На любой остановке"], a:1, e:"Право выйти на любой остановке."},
        {q:"Грозит полицией?", o:["Бояться","Пусть вызывает"], a:1, e:"Полиция — единственный орган с властью."},
        {q:"Сумма штрафа?", o:["Как скажут","Региональный закон"], a:1, e:"Установлена региональным законом."}
    ]},
    scooter: {t:"Самокаты", q:[
        {q:"Вдвоем?", o:["Можно","Запрещено"], a:1, e:"Категорически запрещено."},
        {q:"Где ехать?", o:["Тротуар","Край проезжей части"], a:1, e:"Край проезжей части если нет велодорожки."},
        {q:"Скорость?", o:["Любая","25 км/ч"], a:1, e:"Лимит — 25 км/ч."},
        {q:"Пьяный?", o:["Можно","Наказуемо"], a:1, e:"Наказуемо, как и для авто."},
        {q:"ДТП с пешеходом?", o:["Пешеход виноват","Вина самокатчика"], a:1, e:"Самокат — источник опасности."},
        {q:"Зебра?", o:["Проехать","Спешиться"], a:1, e:"Обязательно спешиться."},
        {q:"Автомагистрали?", o:["Можно","Запрещено"], a:1, e:"Запрещено."},
        {q:"Парковка?", o:["Где угодно","По правилам"], a:1, e:"Штрафы за парковку действуют."},
        {q:"Права?", o:["Да","Нет"], a:1, e:"Права не нужны."},
        {q:"Более 35 кг?", o:["СИМ","Может быть мопедом"], a:1, e:"Приравнивается к мопеду."}
    ]}
};
Object.keys(db).forEach(k => {
    document.getElementById('list').innerHTML += `<div class="card" onclick="show('${k}')">${db[k].t}</div>`;
});
function show(k) {
    document.getElementById('m').style.display='none';
    document.getElementById('q-area').style.display='block';
    let h = '';
    db[k].q.forEach(i => {
        h += `<div class="card"><b>${i.q}</b>`;
        i.o.forEach((o, idx) => h += `<div class="option" onclick="alert('${idx==i.a ? 'Верно: ' + i.e : 'Неверно. ' + i.e}')">${o}</div>`);
        h += `</div>`;
    });
    document.getElementById('content').innerHTML = h;
}
</script>
</body>
</html>
