<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП Справочник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: var(--tg-theme-bg-color, #17212b); --text-color: var(--tg-theme-text-color, #f5f5f5); --card-bg: var(--tg-theme-secondary-bg-color, #232e3c); --button-color: var(--tg-theme-button-color, #5288c1); --button-text: var(--tg-theme-button-text-color, #ffffff); }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; }
        .category-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; }
        .option-btn { background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 8px; text-align: left; color: white; }
        .correct { border-color: #4caf50; background-color: rgba(76, 175, 80, 0.2); }
        .wrong { border-color: #ef5350; background-color: rgba(239, 83, 80, 0.2); }
        .action-btn { width: 100%; background-color: var(--button-color); color: var(--button-text); border: none; padding: 14px; border-radius: 10px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
<div id="app">
    <div id="menu">
        <h2 style="text-align:center">ППП: Алгоритмы защиты</h2>
        <div id="list"></div>
    </div>
    <div id="quiz" style="display:none">
        <div id="back" onclick="location.reload()" style="color:var(--button-color); margin-bottom:10px;">← Назад</div>
        <div class="card">
            <div id="q-text" style="font-weight:bold; margin-bottom:15px;"></div>
            <div id="options"></div>
            <div id="expl" style="margin-top:15px; font-size:14px; color:#aaa;"></div>
        </div>
    </div>
</div>
<script>
    const data = {
        police: { t: "Полиция", i: "👮", q: [
            {q:"Полицейский требует телефон для досмотра. Твои действия?", o:["Отдать", "Требовать протокол досмотра и понятых", "Убежать"], c:1, e:"Телефон — это личная вещь, осмотр без понятых и протокола незаконен."},
            {q:"Вас остановили на улице. Первый вопрос?", o:["Куда идете?", "Предъявите удостоверение", "Почему без шапки?"], c:1, e:"Всегда требуй представиться и показать удостоверение в развернутом виде."},
            {q:"Полицейский хамит. Что делать?", o:["Хамить в ответ", "Фиксировать на видео, сохранять спокойствие", "Толкать"], c:1, e:"Видео — твой главный свидетель. Не переходи на личности."},
            {q:"Предлагают проехать в отделение 'для беседы'. Обязан?", o:["Да", "Нет, если нет статуса задержанного", "Только с другом"], c:1, e:"Нет статуса задержанного — нет обязательств ехать."},
            {q:"Угрожают 'проблемами', если не подпишешь протокол?", o:["Подписать", "Требовать адвоката и вписать свои возражения", "Плакать"], c:1, e:"Никогда не подписывай пустое или неверное. Пиши: 'С протоколом не согласен'."},
            {q:"Вас досматривают без понятых?", o:["Нормально", "Это нарушение закона", "Быстро соглашаюсь"], c:1, e:"Досмотр без понятых (или видеофиксации) незаконен."},
            {q:"Обязан ли я носить паспорт с собой?", o:["Да, всегда", "Нет, достаточно фото", "Только в миграционной зоне"], c:1, e:"По закону РФ — нет, но это ускорит проверку. Достаточно любого подтверждения личности."},
            {q:"Могут ли забрать телефон в отделении?", o:["Да, всегда", "Только при изъятии с протоколом", "Никогда"], c:1, e:"Только в рамках изъятия с понятыми и протоколом."},
            {q:"Имею ли право на звонок?", o:["Да, в течение 3 часов", "Только с разрешения", "Нет"], c:0, e:"Полиция обязана дать право на телефонный звонок задержанному."},
            {q:"Полицейский не называет причину остановки?", o:["Молчать", "Настаивать на правовом обосновании", "Уходить"], c:1, e:"Требуй озвучить правовые основания для ограничения твоих прав."}
        ]},
        army: { t: "Военкомат", i: "🪖", q: [
            {q:"Пришла повестка в Госуслугах. Обязан явиться?", o:["Да, с момента прихода", "Через 7 дней с даты размещения", "Нет"], c:1, e:"Юридически повестка считается врученной через 7 дней после появления в реестре."},
            {q:"Могут ли мобилизовать, если я не годен?", o:["Да", "Нет, нужно обжаловать решение", "Только после суда"], c:1, e:"Нужно срочно предоставить мед. документы и обжаловать категорию."},
            {q:"Что если повестка в почтовом ящике?", o:["Игнорировать", "Обязательно идти", "Выбросить"], c:0, e:"Повестка должна быть вручена лично под роспись или через реестр."},
            {q:"Отказываются принимать мед. справки?", o:["Сдаваться", "Отправлять заказным письмом с описью", "Идти служить"], c:1, e:"Только официальная переписка — залог защиты прав."},
            {q:"Могут ли забрать прямо из военкомата?", o:["Нет", "Да, если прошел комиссию", "Только с полицией"], c:1, e:"Только после прохождения медкомиссии и решения призывной комиссии."},
            {q:"Право на альтернативную службу?", o:["Нет", "Да, если убеждения противоречат", "Только инвалидам"], c:1, e:"Заявление подается заранее (минимум за полгода)."},
            {q:"Кто должен проводить медкомиссию?", o:["Военком", "Врачи-специалисты", "Секретарь"], c:1, e:"Только профильные врачи. Если их нет — это нарушение."},
            {q:"Могу ли я снимать внутри военкомата?", o:["Да", "Нет, это режимный объект", "Только с разрешения"], c:1, e:"Режимный объект. Съемка запрещена, рискуешь штрафом."},
            {q:"Призвали с болезнью, которую не учли?", o:["Служить", "Подавать в суд и прокуратуру", "Сбежать"], c:1, e:"Жалоба в вышестоящую комиссию и иск в суд приостанавливают призыв."},
            {q:"Обязан ли я сдавать паспорт в военкомате?", o:["Да", "Нет, паспорт — моя собственность", "Только в СИЗО"], c:1, e:"Забирать паспорт запрещено."}
        ]},
        auto: { t: "Авто/ГИБДД", i: "🚗", q: [
            {q:"Остановка вне стационарного поста?", o:["Запрещено", "Разрешено законом", "Только с мигалкой"], c:1, e:"Инспектор имеет право остановить авто в любом месте."},
            {q:"Инспектор требует выйти из машины?", o:["Обязан", "Только если есть подозрение или досмотр", "Никогда"], c:1, e:"Ты обязан выйти, если это необходимо для обеспечения безопасности или действий инспектора."},
            {q:"Алкоголь: предлагаю дунуть в 'трубочку'?", o:["Отказываюсь", "Соглашаюсь", "Требую медиков"], c:2, e:"Не доверяй прибору на месте. Требуй медосвидетельствования в больнице."},
            {q:"Инспектор лезет в бардачок?", o:["Помогаю", "Требую понятых и протокол", "Смотрю"], c:1, e:"Досмотр без владельца (или с его отстранением) незаконен."},
            {q:"Обязан ли я передавать документы в руки?", o:["Да", "Нет, могу держать через стекло", "Спорно"], c:0, e:"По ПДД — обязан передать для проверки."},
            {q:"Штраф на месте?", o:["Плачу", "Никогда, только через банк", "На карту"], c:1, e:"Инспектор не принимает деньги. Штраф оплачивается через банк."},
            {q:"Причина остановки 'проверка документов'?", o:["Законно", "Незаконно", "Спорно"], c:0, e:"Сейчас это законное основание."},
            {q:"Что делать, если инспектор хамит?", o:["Молчать", "Звонить на горячую линию МВД", "Бить"], c:1, e:"Звонок на телефон доверия — самый быстрый способ остудить пыл."},
            {q:"Должен ли быть жетон у инспектора?", o:["Да, всегда", "Нет", "По желанию"], c:0, e:"Да, он обязан его иметь и предъявить по требованию."},
            {q:"Могу ли я сесть в машину инспектора?", o:["Да", "Нет, только если пригласят", "Обязан"], c:1, e:"Не садись без приглашения — это провокация."},
        ]},
        bus: { t: "Транспорт", i: "🚌", q: [
            {q:"Контролер требует паспорт?", o:["Дать", "Не обязан, только полиции", "Сбежать"], c:1, e:"Паспорт для проверки билета обязаны требовать только сотрудники полиции."},
            {q:"Вас пытаются высадить с ребенком?", o:["Выйти", "Стоять на своем — запрещено", "Вызвать полицию"], c:1, e:"Высадка ребенка без сопровождения — грубейшее нарушение закона."},
            {q:"Контролер блокирует двери?", o:["Нормально", "Это незаконное удержание", "Сидеть"], c:1, e:"Удержание — это статья УК РФ (самоуправство/лишение свободы)."},
            {q:"Обязан ли я платить штраф контролеру?", o:["Да", "Нет, только по квитанции через банк", "Никогда"], c:1, e:"Никаких наличных на месте."},
            {q:"Контролер распускает руки?", o:["Терпеть", "Фиксировать, вызывать полицию", "Бить"], c:1, e:"Применение силы — это нападение."},
            {q:"Нет билета, что сказать?", o:["Плакать", "Назвать данные для составления акта", "Молчать"], c:1, e:"Спокойно предоставь данные, не устраивай скандал."},
            {q:"Могу ли я снимать контролера?", o:["Да", "Нет", "С разрешения"], c:0, e:"Это общественное место, съемка разрешена."},
            {q:"Обязан ли я ехать до конца?", o:["Да", "Нет, выйти на следующей", "Как скажут"], c:1, e:"Ты имеешь право выйти на любой остановке."},
            {q:"Контролер грозит полицией?", o:["Бояться", "Пусть вызывает — для тебя это безопаснее", "Убегать"], c:1, e:"Полиция — единственный орган, имеющий законную власть."},
            {q:"Штраф без билета — это сколько?", o:["Сумма фиксирована законом", "Как скажут", "Бесплатно"], c:0, e:"Сумма установлена региональным законом."}
        ]},
        scooter: { t: "Самокаты", i: "🛴", q: [
            {q:"Можно ли ехать вдвоем?", o:["Да", "Нет, штраф", "Если оба маленькие"], c:1, e:"Категорически запрещено ПДД."},
            {q:"Где ездить, если нет велодорожки?", o:["Тротуар", "Проезжая часть (край)", "Везде"], c:1, e:"Только по краю проезжей части, если нет велодорожки."},
            {q:"Скорость самоката в городе?", o:["Не более 25 км/ч", "Любая", "50 км/ч"], c:0, e:"Это предел для СИМ."},
            {q:"Пьяный на самокате?", o:["Можно", "Лишение прав (если есть) и штраф", "Спорно"], c:1, e:"Управление СИМ в нетрезвом виде наказуемо."},
            {q:"Кто виноват в ДТП с пешеходом?", o:["Пешеход", "Водитель самоката", "Случай"], c:1, e:"Самокатчик — источник повышенной опасности."},
            {q:"Нужно ли спешиваться на зебре?", o:["Да", "Нет", "По желанию"], c:0, e:"Обязательно, как и велосипедистам."},
            {q:"Можно ли ездить по автомагистралям?", o:["Да", "Нет, запрещено", "С мигалкой"], c:1, e:"Там запрещено движение СИМ."},
            {q:"Штраф за неправильную парковку?", o:["Нет", "Да, если мешает", "Только эвакуация"], c:1, e:"Да, штрафы за парковку в неположенных местах действуют."},
            {q:"Нужны ли права?", o:["Да", "Нет", "Только на мощные"], c:1, e:"На СИМ права не нужны, но правила соблюдать обязан."},
            {q:"Вес самоката более 35кг?", o:["Это не СИМ", "Это самокат", "Везде можно"], c:0, e:"Если тяжелее 35кг, это может быть приравнено к мопеду."}
        ]}
    };

    function start(k) {
        let q = data[k].q;
        let html = '';
        q.forEach((item, idx) => {
            let options = '';
            item.o.forEach((opt, i) => {
                options += `<button class="option-btn" onclick="check(this, ${i}, ${item.c}, '${item.e}')">${opt}</button>`;
            });
            html += `<div style="margin-bottom:20px"><p>${idx+1}. ${item.q}</p>${options}</div>`;
        });
        document.getElementById('list').innerHTML = `<div class="card">${html}</div>`;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('quiz').style.display = 'block';
    }
    function check(btn, i, c, e) {
        let parent = btn.parentElement;
        Array.from(parent.children).forEach(b => b.disabled = true);
        btn.className = (i == c) ? 'option-btn correct' : 'option-btn wrong';
        parent.innerHTML += `<div style="margin-top:10px; padding:10px; background:rgba(255,255,255,0.1); border-radius:8px;">${e}</div>`;
    }
    Object.keys(data).forEach(k => {
        document.getElementById('list').innerHTML += `<div class="category-card" onclick="start('${k}')"><span>${data[k].i}</span><span style="margin-left:10px">${data[k].t}</span></div>`;
    });
</script>
</body>
</html>
