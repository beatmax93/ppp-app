<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ППП Справочник</title>
    <style>
        body { background: #17212b; color: #fff; padding: 15px; font-family: sans-serif; }
        .card { background: #232e3c; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334455; }
        .btn { background: #5288c1; color: #fff; border: none; padding: 10px; border-radius: 8px; margin-top: 5px; cursor: pointer; width: 100%; text-align: left; display: block; }
        h2 { color: #5288c1; text-align: center; }
        h3 { color: #fff; border-bottom: 2px solid #5288c1; padding-bottom: 5px; }
    </style>
</head>
<body>
    <h2>ППП Справочник</h2>
    <div id="content"></div>

    <script>
        function render(title, qs) {
            document.getElementById('content').innerHTML += `<h3>${title}</h3>`;
            qs.sort(() => Math.random() - 0.5).forEach((item, idx) => {
                let h = `<div class='card'><b>${idx + 1}. ${item.q}</b>`;
                item.o.forEach((o, i) => {
                    h += `<button class='btn' onclick="alert('${i == item.a ? '✅ Верно: ' + item.res : '❌ Неверно: ' + item.res}')">${o}</button>`;
                });
                document.getElementById('content').innerHTML += h + `</div>`;
            });
        }

        render("Полиция", [
            {q:"Сотрудник требует разблокировать телефон. Ваши действия?", o:["Разблокировать и показать", "Вежливо отказать, требуя протокол досмотра и 2 понятых", "Показать только последние сообщения"], a:1, res:"ст. 27.7 КоАП РФ"},
            {q:"Сотрудник остановил на улице, но не представился. Что делать?", o:["Сразу выполнять требования", "Потребовать представиться, назвать должность, звание и причину", "Игнорировать сотрудника"], a:1, res:"ст. 5 ФЗ 'О полиции'"},
            {q:"Вас пригласили в отдел для 'беседы'. Обязаны ли вы идти?", o:["Да, всегда", "Только если есть официальная повестка или задержание", "Зависит от настроения сотрудника"], a:1, res:"ст. 14 ФЗ 'О полиции'"},
            {q:"Сотрудник хамит и нарушает закон. Что предпринять?", o:["Отвечать хамством", "Фиксировать на видео, спросить жетон, звонить в дежурную часть", "Молчать и подчиняться"], a:1, res:"ст. 8 ФЗ 'О полиции'"},
            {q:"Вам дают пустой протокол на подпись. Что делать?", o:["Подписать, чтобы быстрее отпустили", "Написать 'не согласен' и перечеркнуть пустые поля перед подписью", "Отказаться подписывать"], a:1, res:"ст. 28.2 КоАП РФ"},
            {q:"Обыск без понятых (или видеофиксации). Законно?", o:["Да, если сотрудник один", "Нет, это нарушение процедуры", "Зависит от тяжести дела"], a:1, res:"ст. 27.7 КоАП РФ"},
            {q:"Сотрудник требует паспорт в руки. Обязаны ли вы давать?", o:["Нет, достаточно показать в развернутом виде", "Да, обязан передать в руки", "Зависит от ситуации"], a:0, res:"ст. 5 ФЗ 'О полиции'"},
            {q:"Ваш телефон изымают. Какова процедура?", o:["Просто отдать сотруднику", "Только с протоколом изъятия, двумя понятыми и описью", "Отдать после устных угроз"], a:1, res:"ст. 27.10 КоАП РФ"},
            {q:"Вас задержали. Имеете ли право на звонок?", o:["Нет", "Да, в течение 3 часов для уведомления близких", "Только с разрешения начальника"], a:1, res:"ст. 14 ФЗ 'О полиции'"},
            {q:"Сотрудник ссылается на 'рейд'. Обязаны ли вы подчиняться?", o:["Да, любые требования в рейде законны", "Только если требования законны и обоснованы", "Нет, рейды не существуют"], a:1, res:"ст. 5 ФЗ 'О полиции'"}
        ]);

        render("Военкомат", [
            {q:"Повестка пришла в Госуслуги. Считается ли она врученной?", o:["Нет, только бумажная лично", "Да, с момента размещения", "Да, через 7 дней после размещения"], a:2, res:"ст. 31 ФЗ-53"},
            {q:"Вам прислали повестку в почтовый ящик. Обязаны ли вы идти?", o:["Да, обязан", "Нет, повестка вручается только лично в руки под роспись", "Да, если прислали заказным письмом"], a:1, res:"ст. 31 ФЗ-53"},
            {q:"В военкомате не учитывают жалобы на здоровье. Что делать?", o:["Смириться", "Подавать заявление в суд или вышестоящую призывную комиссию", "Убегать из кабинета"], a:1, res:"ст. 28 ФЗ-53"},
            {q:"Вы хотите подать справки о болезнях. Как это сделать грамотно?", o:["Принести на комиссию устно", "Отправить заказным письмом с описью в военкомат и копию в прокуратуру", "Оставить у секретаря без отметки"], a:1, res:"ФЗ-59"},
            {q:"Вам угрожают 'сразу в часть' из военкомата. Законно?", o:["Да, так положено", "Нет, сначала медицинская комиссия и призывная комиссия", "Да, если призыв идет"], a:1, res:"ст. 26 ФЗ-53"},
            {q:"Хотите альтернативную гражданскую службу. Когда подавать?", o:["В день призыва", "За полгода до начала призыва", "Во время медкомиссии"], a:1, res:"ФЗ-113"},
            {q:"Вам угрожают забрать паспорт. Ваши действия?", o:["Отдать", "Заявить, что изъятие паспорта незаконно", "Попросить расписку"], a:1, res:"Положение о паспорте"},
            {q:"Можно ли снимать на видео в военкомате?", o:["Да, это публичное место", "Нет, это режимный объект", "Только если разрешит врач"], a:1, res:"ст. 24 ФЗ-53"},
            {q:"Кто принимает решение о годности?", o:["Военком", "Призывная комиссия на основании диагнозов врачей", "Любой сотрудник военкомата"], a:1, res:"ст. 29 ФЗ-53"},
            {q:"Вы не согласны с решением комиссии. Что делать?", o:["Ждать следующего призыва", "Обжаловать решение в суде, тогда призыв приостанавливается", "Ничего не делать"], a:1, res:"ст. 28 ФЗ-53"}
        ]);

        render("Транспорт", [
            {q:"Контролер требует паспорт в руки для штрафа. Обязаны ли вы?", o:["Да, обязан дать", "Нет, показать в развернутом виде без передачи в руки", "Паспорт вообще не нужен"], a:1, res:"ФЗ-259"},
            {q:"Вас пытаются высадить из автобуса ночью. Что делать?", o:["Выйти без возражений", "Указывать на незаконность удержания, звонить в полицию", "Выходить, если водитель требует"], a:1, res:"ст. 127 УК РФ"},
            {q:"Двери заблокированы до оплаты штрафа. Действия?", o:["Платить", "Требовать открытия, это насильственное удержание", "Сидеть молча"], a:1, res:"ст. 127 УК РФ"},
            {q:"Требуют оплату штрафа наличкой на месте. Законно?", o:["Да", "Нет, оплата только через официальную квитанцию/банк", "Можно переводом на карту"], a:1, res:"ФЗ-259"},
            {q:"Контролер распускает руки. Что делать?", o:["Дать сдачи", "Снимать на видео, заявить о превышении полномочий", "Терпеть"], a:1, res:"ст. 116 УК РФ"},
            {q:"Нет билета, контролер грозит полицией. Что делать?", o:["Бояться", "Пусть вызывает, вы обязаны дать данные для акта", "Бежать"], a:1, res:"ФЗ 'О полиции'"},
            {q:"Имеете ли право снимать контролера на видео?", o:["Нет, запрещено", "Да, это открытая деятельность", "Только с его согласия"], a:1, res:"ГК РФ ст. 152.1"},
            {q:"Вас высаживают на неудобной остановке. Обязаны ли выйти?", o:["Да", "Требовать остановки на законной остановке", "Выходить где угодно"], a:1, res:"Правила перевозок"},
            {q:"Контролер не предъявляет удостоверение. Что делать?", o:["Верить на слово", "Отказываться от диалога без удостоверения", "Спрашивать паспорт у него"], a:1, res:"ФЗ-259"},
            {q:"Штраф кажется завышенным. Что делать?", o:["Платить сколько просят", "Требовать ссылку на региональный закон о штрафах", "Ругаться"], a:1, res:"КоАП субъектов"}
        ]);

        render("ГИБДД", [
            {q:"Инспектор просит выйти из машины и сесть в патрульную. Обязаны?", o:["Да, всегда", "Только при досмотре или задержании", "Никогда"], a:1, res:"Регламент МВД"},
            {q:"Вас остановили вне стационарного поста. Законно?", o:["Нет", "Да, инспектор имеет право", "Только с понятыми"], a:1, res:"ПДД п. 6.11"},
            {q:"Инспектор требует дыхнуть в трубочку. Ваши действия?", o:["Дыхнуть", "Требовать официальное медосвидетельствование с протоколом", "Отказаться полностью"], a:1, res:"ст. 27.12 КоАП"},
            {q:"Досмотр бардачка. Порядок действий?", o:["Открыть самому", "Требовать протокол досмотра и 2 понятых", "Отказываться открывать"], a:1, res:"ст. 27.9 КоАП"},
            {q:"Передача документов. Обязаны ли передавать в руки?", o:["Да", "Нет, показать через стекло", "Зависит от инспектора"], a:0, res:"ПДД п. 2.1.1"},
            {q:"Штраф наличными инспектору. Законно?", o:["Да", "Нет, только через банк", "Да, если сумма маленькая"], a:1, res:"ст. 32.2 КоАП"},
            {q:"Инспектор проверяет документы. Законно?", o:["Да", "Нет, только при нарушении", "Только на посту"], a:0, res:"Регламент МВД"},
            {q:"Инспектор хамит/угрожает. Куда звонить?", o:["Никуда", "На горячую линию МВД/Телефон доверия", "Другу"], a:1, res:"ФЗ 'О полиции'"},
            {q:"Инспектор без жетона. Ваши действия?", o:["Записывать номер машины, фамилию, требовать жетон", "Ничего", "Уезжать"], a:1, res:"ФЗ 'О полиции'"},
            {q:"Просят открыть багажник. Ваши действия?", o:["Открыть", "Требовать протокол досмотра и понятых", "Сказать 'нет'"], a:1, res:"ст. 27.9 КоАП"}
        ]);

        render("Самокаты", [
            {q:"Едете вдвоем на самокате. Что будет?", o:["Ничего", "Нарушение ПДД, штраф", "Запрещено конструкцией"], a:1, res:"ПДД п. 24.8"},
            {q:"Где двигаться на самокате?", o:["Только проезжая часть", "Тротуар (если нет велодорожки)", "Только велодорожки"], a:1, res:"ПДД п. 24.2"},
            {q:"Скорость ограничена?", o:["Нет", "Да, до 25 км/ч", "Да, до 40 км/ч"], a:1, res:"ПДД п. 24.6"},
            {q:"Алкоголь и самокат. Можно?", o:["Да", "Нет, запрещено", "Только пиво"], a:1, res:"ст. 12.29 КоАП"},
            {q:"Сбили пешехода. Кто виноват?", o:["Пешеход", "Самокатчик как владелец источника опасности", "Прокат"], a:1, res:"ГК РФ ст. 1079"},
            {q:"Зебра. Ваши действия?", o:["Проехать быстро", "Спешиться и перейти пешком", "Проехать осторожно"], a:1, res:"ПДД п. 24.8"},
            {q:"Можно ли на магистраль?", o:["Да", "Нет, строго запрещено", "Если есть шлем"], a:1, res:"ПДД п. 16.1"},
            {q:"Парковка где попало. Что грозит?", o:["Ничего", "Штраф по КоАП субъекта", "Эвакуация"], a:1, res:"КоАП субъектов"},
            {q:"Нужны ли права?", o:["Да", "Нет, если СИМ до 250Вт", "Только для аренды"], a:1, res:"ФЗ-196"},
            {q:"Вес самоката более 35кг. Что это?", o:["Обычный СИМ", "Приравнивается к мопеду, нужны права", "Транспортное средство"], a:1, res:"ПДД РФ"}
        ]);
    </script>
</body>
</html>
