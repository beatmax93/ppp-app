<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ППП Справочник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: var(--tg-theme-bg-color, #17212b); --text-color: var(--tg-theme-text-color, #f5f5f5); --card-bg: var(--tg-theme-secondary-bg-color, #232e3c); --button-color: var(--tg-theme-button-color, #5288c1); --button-text: var(--tg-theme-button-text-color, #ffffff); --hint-color: var(--tg-theme-hint-color, #7f91a4); }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        #menu-screen, #quiz-screen, #result-screen { display: none; width: 100%; }
        #menu-screen.active, #quiz-screen.active, #result-screen.active { display: block; }
        .category-card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 18px; }
        .option-btn { background-color: rgba(255,255,255,0.05); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 8px; text-align: left; }
        .correct { border-color: #4caf50; background-color: rgba(46, 125, 50, 0.3); }
        .wrong { border-color: #ef5350; background-color: rgba(198, 40, 40, 0.3); }
        .action-btn { width: 100%; background-color: var(--button-color); color: var(--button-text); border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <div id="menu-screen" class="active">
        <div style="text-align:center; margin-bottom:20px;"><h1>ППП Справочник</h1></div>
        <div id="category-container"></div>
    </div>
    <div id="quiz-screen">
        <div onclick="showMenu()" style="color:var(--button-color); margin-bottom:10px; cursor:pointer;">← В меню</div>
        <div class="card">
            <div id="progress" style="font-size:12px; color:var(--hint-color); margin-bottom:10px;"></div>
            <div id="question" style="font-weight:600; margin-bottom:15px;"></div>
            <div id="options"></div>
            <div id="explanation" style="display:none; background:rgba(82, 136, 193, 0.15); padding:10px; border-radius:8px; margin-top:10px; font-size:14px;"></div>
            <button id="next-btn" class="action-btn" style="display:none; margin-top:15px;" onclick="nextQuestion()">Следующий</button>
        </div>
    </div>
    <div id="result-screen">
        <div class="card" style="text-align:center;">
            <h2>Тест завершён!</h2>
            <div id="score-display" style="font-size:30px; color:var(--button-color); margin:10px 0;"></div>
            <button class="action-btn" onclick="showMenu()">Вернуться в меню</button>
        </div>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp; tg.expand();
    const db = {
        police: { title: "Полиция", icon: "👮", questions: [
            { q: "Снимать полицейского можно?", o: ["Да", "Нет", "С разрешения", "Только без звука"], c: 0, e: "Деятельность полиции открыта." },
            { q: "Досмотр отличается от осмотра?", o: ["Ничем", "Наличием протокола и понятых", "Только местом", "Только временем"], c: 1, e: "Досмотр — это физическое исследование вещей с протоколом." }
        ]},
        army: { title: "Военкомат", icon: "🪖", questions: [
            { q: "Повестка через Реестр?", o: ["С момента открытия", "Через 7 дней", "Не считается", "Через месяц"], c: 1, e: "Через 7 дней с даты размещения." },
            { q: "Категория В?", o: ["Годен", "Ограниченно годен (запас)", "Отсрочка", "Не годен"], c: 1, e: "Зачисление в запас." }
        ]},
        auto: { title: "Авто", icon: "🚗", questions: [
            { q: "Остановка вне поста?", o: ["Запрещена", "Разрешена", "Только с понятыми", "Только ночью"], c: 1, e: "Разрешена." },
            { q: "Выход из авто?", o: ["Всегда", "Только при досмотре", "Никогда", "По просьбе"], c: 1, e: "При досмотре/отстранении." }
        ]},
        bus: { title: "Транспорт", icon: "🚌", questions: [
            { q: "Сила контролера?", o: ["Да", "Нет", "Только в метро", "С полицией"], c: 1, e: "Нет прав на силу." },
            { q: "Высадка ребенка?", o: ["Можно", "Запрещено", "Только зимой", "С МВД"], c: 1, e: "Запрещено." }
        ]},
        scooter: { title: "Самокаты", icon: "🛴", questions: [
            { q: "Скорость?", o: ["15", "25", "40", "Не ограничена"], c: 1, e: "25 км/ч." },
            { q: "Вдвоем?", o: ["Можно", "Запрещено", "С ребенком", "Только на своем"], c: 1, e: "Запрещено." }
        ]}
    };
    let curData = [], curQ = 0, score = 0;
    function showMenu() { document.getElementById('menu-screen').className='active'; document.getElementById('quiz-screen').className=''; document.getElementById('result-screen').className=''; }
    function start(k) { curData = db[k].questions.sort(()=>Math.random()-0.5); curQ = 0; score = 0; document.getElementById('menu-screen').className=''; document.getElementById('quiz-screen').className='active'; loadQ(); }
    function loadQ() { let q = curData[curQ]; document.getElementById('progress').innerText = `Вопрос ${curQ+1}/${curData.length}`; document.getElementById('question').innerText = q.q; let h = ''; q.o.forEach((o, i) => h += `<button class="option-btn" onclick="check(${i}, ${q.c}, '${q.e}')">${o}</button>`); document.getElementById('options').innerHTML = h; document.getElementById('next-btn').style.display='none'; document.getElementById('explanation').style.display='none'; }
    function check(s, c, e) { document.querySelectorAll('.option-btn').forEach((b, i) => { b.disabled=true; b.className='option-btn '+(i==c?'correct':'wrong'); }); document.getElementById('explanation').innerText = e; document.getElementById('explanation').style.display='block'; document.getElementById('next-btn').style.display='block'; if(s==c) score++; }
    function nextQuestion() { curQ++; if(curQ < curData.length) loadQ(); else { document.getElementById('quiz-screen').className=''; document.getElementById('result-screen').className='active'; document.getElementById('score-display').innerText = score + "/" + curData.length; } }
    Object.keys(db).forEach(k => document.getElementById('category-container').innerHTML += `<div class="category-card" onclick="start('${k}')"><div>${db[k].icon}</div><div style="margin-left:15px;">${db[k].title}</div></div>`);
</script>
</body>
</html>
